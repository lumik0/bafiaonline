# Сборка apk для Android. Запускается ТОЛЬКО вручную (Actions → Android → Run workflow).
# Результат - артефакт "bafia-apk" (debug-apk, ставится на телефон или BlueStacks). В Releases ничего не выкладывается.
name: android
on: workflow_dispatch

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      # игра -> dist-app -> android/app/src/main/assets/public
      - run: bun run cap
      # версия приложения - версия игры; номер сборки растёт сам
      - name: Версия
        run: |
          VERSION=$(grep -oE '"[0-9]+\.[0-9]+(\.[0-9]+)?"' common/version.ts | head -1 | tr -d '"')
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"$VERSION\"/" android/app/build.gradle
          echo "Версия $VERSION, сборка ${{ github.run_number }}"
      - name: Сборка debug-apk
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: bafia-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
